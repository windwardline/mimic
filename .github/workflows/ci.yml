name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs exactly the gates AGENTS.md declares in its fleet-gates block, so the
      # contract's gate list is executable rather than prose. Byte-identical in
      # every fleet repository with CI; the conformance checker compares it.
      - name: Run declared gates
        run: |
          gates=$(awk '/^```fleet-gates$/{o=1;next} o&&/^```$/{o=0;next} o&&/^gate: /{sub(/^gate: /,"");print}' AGENTS.md)
          [ -n "$gates" ] || { echo "AGENTS.md declares no gate: entry in its fleet-gates block" >&2; exit 1; }
          n=0
          while IFS= read -r gate; do
            [ -n "$gate" ] || continue
            echo "::group::$gate"
            sh -c "$gate"
            echo "::endgroup::"
            n=$((n + 1))
          done <<< "$gates"
          echo "$n declared gate(s) executed."
