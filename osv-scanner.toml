# OSV-Scanner policy for the dependency-scan gate in
# .github/workflows/security.yml, which passes --config to point here.
#
# An entry here suppresses a finding; it does not fix one. Every entry states
# why the risk is accepted and carries an expiry, because an accepted risk that
# cannot expire is an unreviewed one. When ignoreUntil passes, the gate fails
# again and the decision has to be made a second time on that day's facts.

# braces 3.0.3 -- deeply nested brace patterns exhaust the stack during
# expansion, so an attacker who controls a glob pattern can crash the process.
# https://osv.dev/GHSA-vfj7-8cjw-p6xm (published 2026-09-18)
#
# There is nothing to upgrade to. braces has published no version above 3.0.3,
# and the scanner reports this finding with no fixed version.
#
# It is a devDependency and reaches no deployed surface. The only path in is
# eslint-config-next -> @next/eslint-plugin-next -> fast-glob 3.3.1 ->
# micromatch 4.0.8 -> braces (npm ls braces). The plugin globs for pages
# directories from settings.next.rootDir in this repository's own ESLint
# config, at lint time, locally and in CI. No request, upload or other
# outside input ever becomes a glob pattern there, and none of it is bundled
# into the Next.js build that Vercel serves.
#
# Reconsider before the expiry if any of these change: a patched braces ships,
# @next/eslint-plugin-next moves off fast-glob 3, or braces appears under a
# production dependency.
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-11-09
reason = "braces has published no version above 3.0.3, so there is no patched release to move to. devDependency only: it enters through eslint-config-next -> @next/eslint-plugin-next -> fast-glob -> micromatch, which globs this repository's own lint configuration at lint time. No attacker-controlled pattern reaches it and none of it ships in the production build. Expires 2026-11-09 for re-decision."
